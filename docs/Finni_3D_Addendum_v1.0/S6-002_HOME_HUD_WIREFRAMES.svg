      <rect class="scene" x="12" y="74" width="336" height="22" rx="11"/><text class="label" x="14" y="18">360×640: 2×2 HUD при 200%, content-scroll</text>
    </g>
    <g transform="translate(390 20)">
      <rect class="frame" x="0" y="0" width="390" height="108" rx="18"/><rect class="header" x="0" y="0" width="390" height="24" rx="18"/>
      <rect class="hud" x="12" y="32" width="86" height="34" rx="10"/><rect class="hud" x="104" y="32" width="86" height="34" rx="10"/><rect class="hud" x="196" y="32" width="86" height="34" rx="10"/><rect class="hud" x="288" y="32" width="90" height="34" rx="10"/>
      <rect class="scene" x="12" y="74" width="366" height="22" rx="11"/><text class="label" x="14" y="18">390×844: height → full-Finni scene</text>
    </g>
    <g transform="translate(812 20)">
      <rect class="frame" x="0" y="0" width="412" height="108" rx="18"/><rect class="header" x="0" y="0" width="412" height="24" rx="18"/>
      <rect class="hud" x="16" y="32" width="88" height="34" rx="10"/><rect class="hud" x="110" y="32" width="88" height="34" rx="10"/><rect class="hud" x="204" y="32" width="88" height="34" rx="10"/><rect class="hud" x="298" y="32" width="98" height="34" rx="10"/>
      <rect class="scene" x="16" y="74" width="380" height="22" rx="11"/><text class="label" x="16" y="18">412×915: width/height → scene &amp; rhythm</text>
