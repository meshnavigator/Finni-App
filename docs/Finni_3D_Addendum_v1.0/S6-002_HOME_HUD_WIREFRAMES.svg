    <rect class="card" x="40" y="264" width="280" height="104" rx="24"/>
    <text class="label" x="67" y="300">ЗАГРУЗКА ДАННЫХ</text><text class="small" x="67" y="324">HUD и scene input выключены</text><text class="small" x="67" y="344">без сумм и placeholder-целей</text>
  </g>
  <g transform="translate(420 72)">
