    <text class="state" x="130" y="56" fill="#ffffff">ERROR</text>
    <rect class="error" x="32" y="248" width="296" height="164" rx="24"/>
    <text class="label" x="56" y="283">НЕ УДАЛОСЬ ПРОЧИТАТЬ ДАННЫЕ</text><text class="value" x="56" y="313">{storageError}</text>
    <rect class="cta" x="56" y="336" width="248" height="52" rx="16"/><text class="white" x="143" y="367">Повторить</text>
    <text class="tiny" x="56" y="403">scene/nav заблокированы; Back закрывает overlay</text>
  </g>
  <g transform="translate(800 72)">
    <use href="#base-home"/>
    <text class="state" x="104" y="56">NO_PROFILE</text>
    <rect class="card" x="32" y="246" width="296" height="142" rx="24"/>
    <text class="label" x="54" y="274">ЗНАКОМСТВО</text><text class="value" x="54" y="302">{petName input}</text>
    <text class="small" x="54" y="324">{draftAppearance}</text><text class="small" x="54" y="342">маршруты появятся после профиля</text>
    <rect class="cta" x="54" y="354" width="252" height="52" rx="16"/><text class="white" x="139" y="385">Продолжить</text>
    <rect class="overlay" x="0" y="532" width="360" height="76"/>
    <text class="small" x="66" y="575" fill="#ffffff">Финансовые маршруты ещё недоступны</text>
  </g>
  <g transform="translate(1180 72)">
    <use href="#base-home"/>
    <text class="state" x="132" y="56">READY</text>
    <text class="tiny" x="102" y="483">CTA: начать день из модели</text>
    <rect class="focus" x="16" y="464" width="328" height="52" rx="16"/>
  </g>

  <g transform="translate(40 736)">
    <use href="#base-home"/>
    <text class="state" x="132" y="56">DRAFT</text>
    <text class="tiny" x="106" y="483">CTA: составить/продолжить план</text>
    <text class="tiny" x="42" y="579">План активен; purchases/savings read-only по модели</text>
  </g>
  <g transform="translate(420 736)">
    <use href="#base-home"/>
    <text class="state" x="130" y="56">ACTIVE</text>
    <text class="tiny" x="104" y="483">CTA: продолжить день из модели</text>
    <text class="tiny" x="77" y="579">Маршруты не блокируются номером шага</text>
  </g>
  <g transform="translate(800 736)">
    <use href="#base-home"/>
    <text class="state" x="128" y="56">CLOSED</text>
    <text class="tiny" x="105" y="483">CTA: посмотреть итоги</text>
    <text class="tiny" x="92" y="579">Финансовые действия read-only по lifecycle</text>
  </g>
  <g transform="translate(1180 736)">
    <use href="#base-home"/>
    <text class="state" x="119" y="56">WAITING</text>
    <rect class="card" x="40" y="252" width="280" height="54" rx="16"/>
    <text class="label" x="62" y="277">СЛЕДУЮЩАЯ ДОСТУПНОСТЬ</text><text class="value" x="62" y="296">{nextEligibleDate}</text>
    <text class="tiny" x="112" y="483">CTA только если её дала модель</text>
    <text class="tiny" x="69" y="579">нет вымышленного «завтра» или таймера</text>
  </g>

  <g transform="translate(40 1400)">
    <text class="state" x="0" y="0">Breakpoint strip · та же иерархия, больше места получает сцена, а не новые дублирующие controls</text>
