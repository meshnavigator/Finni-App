<script>
const q=new URLSearchParams(location.search),scale=Number(q.get('scale')||1),state=q.get('state')||'ACTIVE';document.documentElement.style.setProperty('--scale',scale);document.querySelector('.home').dataset.large=String(scale>1);const labels={READY:'Начать день',DRAFT:'Составить план',ACTIVE:'Продолжить день',CLOSED:'Посмотреть итоги',WAITING:'Следующий день позже'};document.querySelector('.cta').textContent=labels[state];document.querySelector('.cta').disabled=state==='WAITING';if(q.has('empty')){document.querySelector('#goal').textContent='Выбери мечту';document.querySelector('#progress').textContent='Цель пока не выбрана'}if(q.has('long')){document.querySelector('#name').textContent='Суперфинни-12345 · О питомце';document.querySelector('#available').textContent='999999999 монет';document.querySelector('#savings').textContent='888888888 монет';document.querySelector('#goal').textContent='Цель: Домик для Финни';document.querySelector('#progress').textContent='888888888 из 300 монет · осталось 0';document.querySelector('#lesson').textContent='Детектив предложений'}

if(scale>1){
 document.querySelector('.cta').textContent={READY:'Начать день',DRAFT:'К плану',ACTIVE:'Мой день',CLOSED:'Итоги дня',WAITING:'День позже'}[state]||'Мой день';
 document.querySelector('#name').textContent=q.has('long')?'Суперфинни-12345':'Финни';
 document.querySelectorAll('.secondary button').forEach((b,i)=>b.textContent=['Прогресс','Помощь','Взрослым'][i]);
 document.querySelector('.rail>button>span').style.fontSize='calc(12px * var(--scale))';
 document.querySelector('#goal').textContent=q.has('empty')?'Выбери мечту':q.has('long')?'Домик для Финни':'Воздушный змей';
 const values=q.has('long')?['1000000000','1000000000']:['100','36'];
 document.querySelector('#available').textContent=values[0];document.querySelector('#savings').textContent=values[1];
 document.querySelector('#progress').innerHTML=q.has('empty')?'Цель пока не выбрана':values[1]+' / '+(q.has('long')?'300':'150')+'<br>Осталось '+(q.has('long')?'0':'114');
 const currency=document.createElement('p');currency.textContent='Монеты';currency.style.margin='0';document.querySelector('.money').prepend(currency);
 requestAnimationFrame(()=>{const b=document.querySelector('.rail>.surface').getBoundingClientRect();document.querySelector('.home').style.setProperty('--pet-top',(b.top-24)+'px');const pet=document.querySelector('.pet'),im=pet.querySelector('img'),w=pet.clientWidth,h=pet.clientHeight,s=Math.min((w-4)/504,(h-8)/560)/1.12;im.src='../../../assets/2d/variants/FINNI-MATRIX-V1/pointy-plain/neutral.png';im.style.width=(941*s)+'px';im.style.height=(1672*s)+'px';im.style.left=(w/2-470*s)+'px';im.style.top=(h-4-1272*s)+'px'});
